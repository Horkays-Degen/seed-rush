<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seed Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#24160d; --soil2:#34200f; --crust:#4a2e17;
  --seed:#f2b632; --leaf:#9cc653; --ember:#ff6a2b; --cream:#fff2d6; --muted:#c9ab86;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--soil);color:var(--cream);font-family:Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:6px 18px;padding:8px 14px;background:var(--soil2);border-bottom:3px solid #150c06;flex-wrap:wrap;font-weight:800;font-size:14px}
#hud .lvl{font-family:"Lilita One",Nunito,sans-serif;font-size:20px;color:var(--seed);letter-spacing:.5px}
#hud .area{color:var(--muted)}
.grp{display:flex;align-items:center;gap:6px}
.bar{width:110px;height:10px;background:#150c06;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a53a,#ffd84a);border-radius:6px;transition:width .2s}
#hPow{display:flex;gap:6px}
.chip{background:#150c06;border-radius:20px;padding:2px 9px;font-size:13px}
#hTime.low{color:#ff7b5c}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
canvas{display:block;border-radius:16px;box-shadow:0 0 0 4px #150c06,0 18px 40px rgba(0,0,0,.5);touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,11,5,.7);padding:16px}
#ov.hide{display:none}
.card{background:var(--crust);border:3px solid #150c06;border-radius:22px;padding:22px 26px;max-width:460px;width:100%;box-shadow:0 10px 0 #150c06;text-align:center}
.card h1{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:56px;line-height:1;margin:0 0 6px;color:var(--seed);text-shadow:0 4px 0 #7a4f15}
.card h2{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:34px;line-height:1.05;margin:0 0 8px;color:var(--seed)}
.card p{margin:6px 0;line-height:1.45;color:var(--cream)}
.card .sub{color:var(--muted);font-size:15px}
.card ul{text-align:left;margin:12px auto;padding:0 0 0 4px;list-style:none;max-width:340px;line-height:1.6;font-size:15px}
.stats{display:flex;justify-content:center;gap:18px;margin:12px 0;font-size:15px}
.stats b{display:block;font-family:"Lilita One",Nunito,sans-serif;font-weight:400;font-size:26px;color:var(--seed)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-family:"Lilita One",Nunito,sans-serif;font-size:20px;border:3px solid #150c06;border-radius:14px;padding:10px 20px;cursor:pointer;background:var(--seed);color:#2a1605;box-shadow:0 5px 0 #150c06}
button.alt{background:#c9ab86}
.lbform{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.lbform input{font:inherit;font-weight:800;font-size:17px;padding:9px 12px;border-radius:12px;border:3px solid #150c06;background:var(--cream);color:#2a1605;width:190px}
.lbform input:focus-visible{outline:3px solid var(--seed);outline-offset:2px}
.board{list-style:none;margin:12px 0 4px;padding:0;text-align:left;max-height:46vh;overflow:auto}
.board li{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;font-weight:800}
.board li:nth-child(odd){background:rgba(0,0,0,.18)}
.board li.me{background:rgba(242,182,50,.28);outline:2px solid var(--seed)}
.board .rk{font-family:"Lilita One",Nunito,sans-serif;font-size:20px;color:var(--seed);text-align:center}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .lv{color:var(--muted);font-size:13px}
.board .sc{font-family:"Lilita One",Nunito,sans-serif;font-size:19px}
.board .empty{display:block;text-align:center;color:var(--muted)}
#mute{margin-left:auto;font-size:16px;padding:4px 10px;border-radius:10px;box-shadow:0 3px 0 #150c06;background:#c9ab86}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #150c06}
button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
@media (max-width:600px){.card h1{font-size:44px}#hud{font-size:12px;gap:4px 12px}.bar{width:70px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="grp"><span class="lvl" id="hLevel">Level 1</span><span class="area" id="hArea">Garden Patch</span></div>
    <div class="grp">🌰 <span id="hSeeds">0/0</span><div class="bar"><i id="hBar"></i></div></div>
    <div class="grp">⏱ <span id="hTime">0</span></div>
    <div class="grp" id="hLives"></div>
    <div class="grp">🏰 <span id="hHill">Dirt Mound</span></div>
    <div class="grp">⭐ <span id="hScore">0</span></div>
    <div id="hPow"></div>
    <button id="mute" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>
  </div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="ov"></div>
  </div>
</div>
<script>
const W=960,H=640;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let k=1;
function fit(){
  const st=$('stage');
  const s=Math.min((st.clientWidth-16)/W,(st.clientHeight-16)/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  k=Math.min(2.5,s*(window.devicePixelRatio||1));
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);
}
addEventListener('resize',fit);

/* ---------- world data ---------- */
const AREAS=[
 {name:'Garden Patch',g:'#6f913a',d:'#5d7d2f',spk:'#86a84a',pat:'grass',rocks:3,pools:1,rock:'#8a7f70',tip:'Grab seeds and carry them to your anthill. Red raider ants steal seeds, so keep moving.'},
 {name:'Sandbox',g:'#d8bb7c',d:'#c3a463',spk:'#ead5a3',pat:'speck',rocks:4,pools:0,rock:'#9a8a74',tip:'Bump a raider that is carrying a seed to snatch it back.'},
 {name:'Kitchen Floor',g:'#e3dccd',d:'#d2c8b2',pat:'check',sz:44,rocks:3,pools:2,rock:'#c8964f',tip:'Soldier ants show up here. They bite. Stay clear or grab a chili 🌶️ and burn them.'},
 {name:'Forest Floor',g:'#4d6a32',d:'#3f5828',spk:'#6c5a2e',pat:'grass',rocks:6,pools:1,rock:'#6f675c',tip:'Rocks everywhere. A mushroom 🍄 makes you big: carry 3 seeds and bowl enemies over.'},
 {name:'Picnic Blanket',g:'#f3ece0',d:'#cf4a40',pat:'check',sz:52,rocks:3,pools:1,rock:'#b98545',tip:'Golden seeds are worth 3. Raiders want them too.'},
 {name:'Desert Dunes',g:'#d9a45a',d:'#c38c45',spk:'#ecc382',pat:'dune',rocks:5,pools:0,rock:'#8e6f4d',tip:'Long runs home. Candy 🍬 makes you fast.'},
 {name:'Swamp',g:'#44654c',d:'#36523e',spk:'#5d7f55',pat:'grass',rocks:3,pools:6,rock:'#5b6159',tip:'Puddles slow you down. A stag beetle hunts here. It takes 3 fire hits.'},
 {name:'Night Garden',g:'#223441',d:'#1a2934',spk:'#2f4a5a',pat:'grass',rocks:5,pools:2,rock:'#46525a',dark:true,tip:'Lights out. You can only see around your ant. Follow the anthill lantern home.'},
 {name:'Rooftop Gravel',g:'#8b8984',d:'#76746e',spk:'#a6a49e',pat:'speck',rocks:8,pools:2,rock:'#5e5c58',tip:'Tight lanes and a crowd of soldiers.'},
 {name:'Volcano Ridge',g:'#4a2a22',d:'#3a1f19',spk:'#6a3a2c',pat:'speck',rocks:6,pools:5,rock:'#2b1b17',lava:true,tip:'Lava burns unless you are on fire. Two beetles. Finish the colony.'}
];
const TIERS=[[0,'Dirt Mound'],[8,'Ant Hill'],[22,'Hill Fort'],[45,'Ant Tower'],[80,'Seed Castle'],[125,'Colony Citadel']];
function tierOf(n){let t=0;for(let i=0;i<TIERS.length;i++)if(n>=TIERS[i][0])t=i;return t}
const PU={big:{e:'🍄',name:'Big',dur:8},fast:{e:'🍬',name:'Speed',dur:8},fire:{e:'🌶️',name:'Fire',dur:7},life:{e:'💧',name:'Dew'}};

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}

/* ---------- state ---------- */
let state='menu',lvl=1,A,cfg,timeLeft=0,score=0,total=0,delivered=0,startScore=0,startTotal=0;
let P,enemies=[],seeds=[],seedQ=[],pups=[],rocks=[],pools=[],parts=[],texts=[],bg,home,nest,pupT=0,shake=0,homePop=0,kills=0,stolen=0,clock=0;
const keys=new Set();
const joy={on:false,ox:0,oy:0,x:0,y:0,id:null};

function load(){try{return JSON.parse(localStorage.getItem('seedrush')||'null')}catch(e){return null}}
function save(o){try{localStorage.setItem('seedrush',JSON.stringify(o))}catch(e){}}


/* ---------- audio (Web Audio, no files) ---------- */
const AU={c:null,m:null,sfx:null,mus:null,nb:null,muted:false,musOn:false,step:0,next:0,timer:null};
try{AU.muted=localStorage.getItem('seedrush_mute')==='1'}catch(e){}
function audioInit(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(!AU.c){AU.c=new AC();AU.m=AU.c.createGain();AU.m.gain.value=AU.muted?0:.7;AU.m.connect(AU.c.destination);
    const comp=AU.c.createDynamicsCompressor();comp.connect(AU.m);
    AU.sfx=AU.c.createGain();AU.sfx.gain.value=.9;AU.sfx.connect(comp);
    AU.mus=AU.c.createGain();AU.mus.gain.value=.16;AU.mus.connect(comp);
    const n=AU.c.sampleRate;AU.nb=AU.c.createBuffer(1,n,n);const d=AU.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}
  if(AU.c.state==='suspended')AU.c.resume();
}
function setMute(v){AU.muted=v;$('mute').textContent=v?'🔇':'🔊';try{localStorage.setItem('seedrush_mute',v?'1':'0')}catch(e){}
  if(AU.m)AU.m.gain.setTargetAtTime(v?0:.7,AU.c.currentTime,.03)}
function tone(f,d,o){
  if(!AU.c)return;o=o||{};const t=AU.c.currentTime+(o.at||0);
  const os=AU.c.createOscillator(),g=AU.c.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const v=o.vol||.15;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.atk||.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  os.connect(g);g.connect(o.bus||AU.sfx);os.start(t);os.stop(t+d+.05);
}
function noise(d,o){
  if(!AU.c)return;o=o||{};const t=AU.c.currentTime+(o.at||0);
  const src=AU.c.createBufferSource();src.buffer=AU.nb;const fl=AU.c.createBiquadFilter();fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t);fl.Q.value=o.q||1;
  if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+d);
  const g=AU.c.createGain(),v=o.vol||.3;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(fl);fl.connect(g);g.connect(AU.sfx);src.start(t,Math.random()*.5);src.stop(t+d+.05);
}
const SND={
  click(){tone(660,.05,{type:'triangle',vol:.12})},
  pick(){tone(880,.06,{vol:.08});tone(1320,.09,{vol:.08,at:.05})},
  gold(){[880,1109,1319,1760].forEach((f,i)=>tone(f,.12,{type:'triangle',vol:.14,at:i*.05}))},
  deliver(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.16,at:i*.06}));noise(.15,{f:5000,vol:.05,at:.18})},
  grow(){[392,523,659,784,1047].forEach((f,i)=>{tone(f,.3,{type:'sawtooth',vol:.07,at:i*.09});tone(f*2,.3,{type:'triangle',vol:.08,at:i*.09})})},
  big(){tone(160,.35,{to:520,vol:.18});tone(240,.35,{to:780,type:'triangle',vol:.1})},
  fast(){tone(500,.25,{type:'sine',to:2200,vol:.18});tone(700,.2,{type:'sine',to:2600,vol:.08,at:.08})},
  fire(){noise(.5,{f:400,to:3000,vol:.35,q:.7});tone(120,.45,{type:'sawtooth',to:420,vol:.1})},
  life(){[660,990,1320].forEach((f,i)=>tone(f,.25,{type:'sine',vol:.16,at:i*.07}))},
  burn(){noise(.35,{f:2500,to:300,vol:.4,ft:'lowpass'});tone(320,.3,{type:'sawtooth',to:70,vol:.12})},
  bump(){tone(150,.14,{type:'sine',to:55,vol:.35});noise(.07,{f:500,vol:.15})},
  thief(){tone(700,.22,{to:220,vol:.12})},
  snatch(){tone(420,.14,{to:980,vol:.12});tone(980,.08,{vol:.08,at:.12})},
  lost(){tone(300,.25,{type:'triangle',to:180,vol:.06})},
  hurt(){tone(240,.4,{type:'sawtooth',to:70,vol:.22});noise(.25,{f:800,vol:.25})},
  crackle(){noise(.05,{f:rnd(1500,4000),vol:.07,q:3})},
  tick(){tone(1250,.035,{type:'square',vol:.06})},
  clear(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.16,at:i*.1}));[262,392].forEach((f,i)=>tone(f,.6,{type:'sine',vol:.14,at:.3+i*.2}))},
  fail(){[392,349,311,262].forEach((f,i)=>tone(f,.35,{type:'triangle',vol:.15,at:i*.18}))},
};
function sfx(n){try{SND[n]&&SND[n]()}catch(e){}}
/* procedural music, a new groove per area */
const SCALES={maj:[0,2,4,7,9,12,14,16],min:[0,3,5,7,10,12,15,17]};
function musicStart(){
  if(!AU.c||AU.musOn)return;AU.musOn=true;AU.step=0;AU.next=AU.c.currentTime+.1;
  const R=mulberry(lvl*101);const sc=(A&&(A.dark||A.lava||lvl%3===0))?SCALES.min:SCALES.maj;
  const root=[110,123.5,98,130.8,110,103.8,98,92.5,116.5,87.3][lvl-1];
  const bass=[0,0,4,0,3,3,4,2].map(i=>sc[i%sc.length]);
  const lead=[];for(let i=0;i<16;i++)lead.push(R()<.55?sc[Math.floor(R()*sc.length)]:null);
  const bpm=104+lvl*5,sp=60/bpm/2;
  AU.timer=setInterval(()=>{
    if(!AU.musOn)return;
    while(AU.next<AU.c.currentTime+.12){
      const st=AU.step,at=AU.next-AU.c.currentTime,hz=s=>root*Math.pow(2,s/12);
      if(st%2===0)tone(hz(bass[(st/2)%8]),sp*1.8,{type:'triangle',vol:.5,at,bus:AU.mus});
      const l=lead[st%16];if(l!==null&&(st>=16||st%4!==3))tone(hz(l)*4,sp*.9,{type:'square',vol:.12,at,bus:AU.mus});
      if(st%4===0)tone(90,.12,{type:'sine',to:40,vol:.5,at,bus:AU.mus});
      if(st%4===2){const t=AU.c.currentTime+at;const src=AU.c.createBufferSource();src.buffer=AU.nb;const f=AU.c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AU.c.createGain();g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);src.connect(f);f.connect(g);g.connect(AU.mus);src.start(t);src.stop(t+.08)}
      AU.step=(st+1)%32;AU.next+=sp;
    }
  },25);
}
function musicStop(){AU.musOn=false;clearInterval(AU.timer);AU.timer=null}

/* ---------- level setup ---------- */
function setupLevel(n){
  A=AREAS[n-1];
  const R=mulberry(n*7919+13);
  const flip=n%2===0;
  home={x:115,y:flip?135:H-135};
  nest={x:W-70,y:flip?H-110:110};
  rocks=[];pools=[];
  const ok=(x,y,r)=>{
    if(Math.hypot(x-home.x,y-home.y)<r+130)return false;
    if(Math.hypot(x-nest.x,y-nest.y)<r+90)return false;
    for(const o of rocks.concat(pools))if(Math.hypot(x-o.x,y-o.y)<r+o.r+34)return false;
    return true};
  for(let i=0;i<A.rocks;i++)for(let t=0;t<80;t++){const r=16+R()*22,x=60+R()*(W-120),y=60+R()*(H-120);if(ok(x,y,r)){rocks.push({x,y,r,s:R()*1000});break}}
  for(let i=0;i<A.pools;i++)for(let t=0;t<80;t++){const r=28+R()*30,x=90+R()*(W-180),y=70+R()*(H-140);if(ok(x,y,r)){pools.push({x,y,r,lava:!!A.lava,ph:R()*6});break}}
  cfg={target:5+n*2,time:60+n*8,raiders:Math.ceil(n/2),soldiers:Math.floor(n/3),beetles:n>=7?(n===10?2:1):0,spd:1+(n-1)*0.045,field:Math.min(8,3+n)};
  buildBg();
  P={x:home.x+70,y:home.y,a:0,r:11,load:[],lives:3,inv:1.5,stun:0,big:0,fast:0,fire:0,legT:0};
  enemies=[];
  for(let i=0;i<cfg.raiders;i++)enemies.push(makeEnemy('raider'));
  for(let i=0;i<cfg.soldiers;i++)enemies.push(makeEnemy('soldier'));
  for(let i=0;i<cfg.beetles;i++)enemies.push(makeEnemy('beetle'));
  seeds=[];seedQ=[];pups=[];parts=[];texts=[];
  for(let i=0;i<cfg.field;i++)spawnSeed();
  timeLeft=cfg.time;delivered=0;pupT=4;kills=0;stolen=0;shake=0;homePop=0;
  startScore=score;startTotal=total;
}
function makeEnemy(type){
  const base={raider:{r:9,spd:95,hp:1},soldier:{r:12,spd:100,hp:1},beetle:{r:20,spd:68,hp:3}}[type];
  return {type,x:nest.x+rnd(-30,30),y:nest.y+rnd(-30,30),a:Math.PI,r:base.r,spd:base.spd,hp:base.hp,
    load:0,stun:0,vx:0,vy:0,dead:false,resp:0,wx:0,wy:0,wt:0,legT:Math.random()*6,hitCd:0};
}
function freeSpot(minHome){
  for(let t=0;t<100;t++){
    const x=rnd(40,W-40),y=rnd(40,H-40);
    if(Math.hypot(x-home.x,y-home.y)<minHome)continue;
    if(Math.hypot(x-nest.x,y-nest.y)<70)continue;
    let bad=false;for(const o of rocks.concat(pools))if(Math.hypot(x-o.x,y-o.y)<o.r+16){bad=true;break}
    if(!bad)return{x,y};
  }
  return{x:W/2,y:H/2};
}
function spawnSeed(){
  const p=freeSpot(140);
  const gold=lvl>=3&&Math.random()<0.13;
  seeds.push({x:p.x,y:p.y,v:gold?3:1,a:Math.random()*6});
}
function dropSeed(x,y,v){seeds.push({x:Math.max(20,Math.min(W-20,x)),y:Math.max(20,Math.min(H-20,y)),v,a:Math.random()*6})}
function takeSeed(s){const i=seeds.indexOf(s);if(i>=0)seeds.splice(i,1);seedQ.push(1.2)}

function buildBg(){
  bg=document.createElement('canvas');bg.width=W;bg.height=H;
  const g=bg.getContext('2d');const R=mulberry(lvl*31+7);
  g.fillStyle=A.g;g.fillRect(0,0,W,H);
  if(A.pat==='check'){const s=A.sz;g.fillStyle=A.d;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s)if(((x+y)/s)%2===1)g.fillRect(x,y,s,s);
    g.strokeStyle='rgba(0,0,0,.06)';g.lineWidth=2;for(let x=0;x<=W;x+=s){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<=H;y+=s){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}
  else if(A.pat==='dune'){g.strokeStyle=A.d;g.lineWidth=3;for(let y=-20;y<H+40;y+=34){g.beginPath();for(let x=0;x<=W;x+=10)g.lineTo(x,y+Math.sin(x/70+y)*9);g.stroke()}
    for(let i=0;i<500;i++){g.fillStyle=R()<.5?A.spk:A.d;g.fillRect(R()*W,R()*H,2,2)}}

  for(const r of rocks){
    const RR=mulberry(r.s|0);
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(r.x+4,r.y+6,r.r,r.r*.85,0,0,7);g.fill();
    g.beginPath();const n=9;for(let i=0;i<n;i++){const an=i/n*Math.PI*2,rr=r.r*(.8+RR()*.3);g.lineTo(r.x+Math.cos(an)*rr,r.y+Math.sin(an)*rr)}g.closePath();
    const gr=g.createRadialGradient(r.x-r.r*.3,r.y-r.r*.4,2,r.x,r.y,r.r*1.1);gr.addColorStop(0,lighten(A.rock,40));gr.addColorStop(1,A.rock);

function lighten(hex,amt){const n=parseInt(hex.slice(1),16);const c=x=>Math.min(255,x+amt);return`rgb(${c(n>>16)},${c(n>>8&255)},${c(n&255)})`}

/* ---------- gameplay ---------- */
function hurt(){
  if(P.inv>0)return;
  P.lives--;P.inv=2;P.stun=.5;shake=12;sfx('hurt');
  for(const v of P.load)dropSeed(P.x+rnd(-25,25),P.y+rnd(-25,25),v);
  if(P.load.length)say(P.x,P.y-24,'Dropped!','#ff8a6b');
  P.load=[];burst(P.x,P.y,'#ff5b4a',16,160);
  if(P.lives<=0)fail('lives');
}
function killEnemy(e,pts){
  if(e.load){dropSeed(e.x,e.y,e.load);e.load=0}
  e.dead=true;e.resp=e.type==='beetle'?12:6;kills++;sfx('burn');
  const p=pts||25;score+=p;say(e.x,e.y-18,'+'+p,'#ffb347');
  burst(e.x,e.y,'#ff8a2b',22,200);burst(e.x,e.y,'#ffd84a',10,120);
}
function knock(e,f){const a=Math.atan2(e.y-P.y,e.x-P.x);e.vx=Math.cos(a)*f;e.vy=Math.sin(a)*f}
function collide(o){
  for(const r of rocks){const dx=o.x-r.x,dy=o.y-r.y,d=Math.hypot(dx,dy)||1,m=r.r+o.r;if(d<m){o.x=r.x+dx/d*m;o.y=r.y+dy/d*m}}
  o.x=Math.max(o.r,Math.min(W-o.r,o.x));o.y=Math.max(o.r,Math.min(H-o.r,o.y));
}
function poolAt(o){for(const p of pools)if(Math.hypot(o.x-p.x,o.y-p.y)<p.r*.92)return p;return null}

function update(dt){
  clock+=dt;
  const pt=Math.ceil(timeLeft);timeLeft-=dt;if(Math.ceil(timeLeft)<pt&&pt<=11&&timeLeft>0)sfx('tick');
  if(P.fire>0&&Math.random()<dt*14)sfx('crackle');
  if(timeLeft<=0){timeLeft=0;fail('time');return}
  for(const k of['inv','stun','big','fast','fire'])P[k]=Math.max(0,P[k]-dt);
  P.r=P.big>0?17:11;

  let ix=0,iy=0;
  if(keys.has('ArrowLeft')||keys.has('KeyA'))ix--;if(keys.has('ArrowRight')||keys.has('KeyD'))ix++;
  if(keys.has('ArrowUp')||keys.has('KeyW'))iy--;if(keys.has('ArrowDown')||keys.has('KeyS'))iy++;
  let mag=Math.hypot(ix,iy);if(mag){ix/=mag;iy/=mag;mag=1}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.hypot(dx,dy);if(l>8){ix=dx/l;iy=dy/l;mag=Math.min(1,l/50)}}
  const pool=poolAt(P);
  if(pool&&pool.lava&&P.fire<=0)hurt();
  let spd=165*(P.fast>0?1.75:1)*(pool&&!pool.lava?.55:1)*(P.load.length?.92:1);
  if(P.stun<=0&&mag){
    P.a+=angDiff(Math.atan2(iy,ix),P.a)*Math.min(1,dt*14);
    P.x+=ix*spd*mag*dt;P.y+=iy*spd*mag*dt;P.legT+=dt*spd*.12;
    if(P.fast>0&&Math.random()<.6)parts.push({x:P.x,y:P.y,vx:0,vy:0,l:.3,ml:.3,c:'rgba(255,240,200,.6)',s:P.r*.7});
  }
  collide(P);
  if(P.fire>0)for(let i=0;i<2;i++)parts.push({x:P.x+rnd(-P.r,P.r),y:P.y+rnd(-P.r,P.r),vx:rnd(-20,20),vy:rnd(-60,-20),l:.45,ml:.45,c:Math.random()<.5?'#ff6a2b':'#ffc23a',s:rnd(3,6)});

  for(const s of seeds.slice())if(P.load.length<capOf()&&Math.hypot(P.x-s.x,P.y-s.y)<P.r+8){P.load.push(s.v);takeSeed(s);burst(s.x,s.y,'#ffd84a',6,80);sfx(s.v>1?'gold':'pick')}
  for(let i=seedQ.length-1;i>=0;i--){seedQ[i]-=dt;if(seedQ[i]<=0){seedQ.splice(i,1);spawnSeed()}}

  pupT-=dt;
  if(pupT<=0){pupT=rnd(6,10);if(pups.length<2){
    const bag=['big','big','fast','fast','fire','fire'];if(P.lives<5&&lvl>=2)bag.push('life');
    const p=freeSpot(100);pups.push({x:p.x,y:p.y,t:bag[Math.floor(Math.random()*bag.length)],l:12})}}
  for(const u of pups.slice()){u.l-=dt;if(u.l<=0){pups.splice(pups.indexOf(u),1);continue}
    if(Math.hypot(P.x-u.x,P.y-u.y)<P.r+14){pups.splice(pups.indexOf(u),1);
      if(u.t==='life'){P.lives=Math.min(5,P.lives+1);say(u.x,u.y-20,'+1 life','#8fd3ff')}
      else{P[u.t]=PU[u.t].dur;say(u.x,u.y-20,PU[u.t].name+'!',u.t==='fire'?'#ff8a2b':'#fff2d6')}
      burst(u.x,u.y,'#fff2d6',14,150);sfx(u.t)}}

  const hr=homeR();
  if(P.load.length&&Math.hypot(P.x-home.x,P.y-home.y)<hr+P.r){
    const sum=P.load.reduce((a,b)=>a+b,0);const before=tierOf(total);
    delivered+=sum;total+=sum;score+=sum*10;P.load=[];homePop=1;
    sfx('deliver');say(home.x,home.y-hr-10,'+'+sum+' seed'+(sum>1?'s':''),'#ffd84a');burst(home.x,home.y-10,'#ffd84a',18,160);
    if(tierOf(total)>before){say(home.x,home.y-hr-36,'Anthill grew: '+TIERS[tierOf(total)][1],'#9cf07a');burst(home.x,home.y,'#9cf07a',30,220);sfx('grow')}
    if(delivered>=cfg.target){clearLevel();return}
  }

  for(const e of enemies)updEnemy(e,dt);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const t of texts){t.y-=28*dt;t.l-=dt}texts=texts.filter(t=>t.l>0);
  shake=Math.max(0,shake-dt*30);homePop=Math.max(0,homePop-dt*2.5);
}

function updEnemy(e,dt){
  if(e.dead){e.resp-=dt;if(e.resp<=0)Object.assign(e,makeEnemy(e.type));return}
  e.hitCd=Math.max(0,e.hitCd-dt);
  if(e.vx||e.vy){e.x+=e.vx*dt;e.y+=e.vy*dt;const f=Math.pow(.03,dt);e.vx*=f;e.vy*=f;if(Math.abs(e.vx)+Math.abs(e.vy)<6){e.vx=0;e.vy=0}}
  if(e.stun>0){e.stun-=dt;collide(e);return}
  let tx,ty,spd=e.spd*cfg.spd,wander=false;
  const dp=Math.hypot(P.x-e.x,P.y-e.y);
  if(P.fire>0&&dp<160&&e.type!=='beetle'){tx=e.x+(e.x-P.x);ty=e.y+(e.y-P.y);spd*=1.05}
  else if(e.type==='raider'){
    if(e.load){tx=nest.x;ty=nest.y;
      if(Math.hypot(e.x-nest.x,e.y-nest.y)<24){stolen+=e.load;say(nest.x,nest.y-34,'Seed stolen','#ff8a6b');sfx('lost');e.load=0}}
    else if(P.load.length&&dp<170&&P.inv<=0){tx=P.x;ty=P.y;spd*=1.1}
    else{let best=null,bd=1e9;for(const s of seeds){const d=Math.hypot(s.x-e.x,s.y-e.y);if(d<bd){bd=d;best=s}}
      if(best){tx=best.x;ty=best.y;if(bd<e.r+8){e.load=best.v;takeSeed(best)}}else wander=true}
  }else{
    const range=e.type==='beetle'?360:230;
    if(dp<range&&P.inv<=0){tx=P.x;ty=P.y}else wander=true;
  }
  if(wander){e.wt-=dt;if(e.wt<=0||Math.hypot(e.wx-e.x,e.wy-e.y)<20){const p=freeSpot(60);e.wx=p.x;e.wy=p.y;e.wt=rnd(3,6)}tx=e.wx;ty=e.wy;spd*=.6}
  e.a+=Math.max(-5*dt,Math.min(5*dt,angDiff(Math.atan2(ty-e.y,tx-e.x),e.a)));
  const pl=poolAt(e);
  if(pl&&pl.lava&&e.type!=='beetle'){killEnemy(e,15);return}
  if(pl&&!pl.lava)spd*=.55;
  e.x+=Math.cos(e.a)*spd*dt;e.y+=Math.sin(e.a)*spd*dt;e.legT+=dt*spd*.14;
  collide(e);
  if(Math.hypot(P.x-e.x,P.y-e.y)<e.r+P.r)contact(e);
}
function contact(e){
  if(P.fire>0){
    if(e.type==='beetle'){if(e.hitCd>0)return;e.hp--;e.hitCd=.6;knock(e,380);sfx('bump');e.stun=.8;burst(e.x,e.y,'#ff8a2b',12,160);if(e.hp<=0)killEnemy(e,80)}
    else killEnemy(e);return}
  if(P.big>0){
    if(e.hitCd>0)return;e.hitCd=.5;knock(e,e.type==='beetle'?240:430);e.stun=e.type==='beetle'?.7:1.8;shake=5;sfx('bump');
    if(e.load&&P.load.length<capOf()){P.load.push(e.load);e.load=0;say(P.x,P.y-26,'Got it back','#9cf07a')}
    return}
  if(e.type==='raider'){
    if(e.load&&P.load.length<capOf()){P.load.push(e.load);e.load=0;e.stun=1.3;knock(e,260);sfx('snatch');say(P.x,P.y-26,'Snatched back','#9cf07a');return}
    if(P.load.length&&P.inv<=0&&!e.load){e.load=P.load.pop();P.inv=.9;sfx('thief');say(P.x,P.y-26,'Thief!','#ff8a6b');return}
    const a=Math.atan2(e.y-P.y,e.x-P.x);e.x=P.x+Math.cos(a)*(e.r+P.r);e.y=P.y+Math.sin(a)*(e.r+P.r);
  }else hurt();
}
const homeR=()=>30+Math.min(total,170)*.22;

  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,R,R*.8,0,Math.PI,0);ctx.quadraticCurveTo(R*.9,R*.35,0,R*.4);ctx.quadraticCurveTo(-R*.9,R*.35,-R,0);ctx.fill();

      ctx.fillStyle='rgba(255,230,120,.7)';for(let i=0;i<3;i++){const a=clock*1.3+i*2+p.ph;ell(p.x+Math.cos(a)*p.r*.45,p.y+Math.sin(a*1.3)*p.r*.35,3+Math.sin(clock*4+i)*1.5,3);ctx.fill()}}
    else{ctx.fillStyle='rgba(60,120,170,.55)';ell(p.x,p.y,p.r,p.r*.9);ctx.fill();ctx.strokeStyle='rgba(200,230,255,.35)';ctx.lineWidth=2;
      ell(p.x,p.y,p.r*(.5+.2*Math.sin(clock*2+p.ph)),p.r*.4*(.5+.2*Math.sin(clock*2+p.ph))/.5*.9);ctx.stroke()}
  }
  drawNest();drawHill();
  for(const s of seeds)drawSeed(s.x,s.y,s.a,s.v);
  ctx.font='26px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const u of pups){if(u.l<3&&Math.floor(u.l*6)%2)continue;const b=Math.sin(clock*4+u.x)*3;
    ctx.fillStyle='rgba(255,242,214,.25)';ell(u.x,u.y+b,17,17);ctx.fill();ctx.fillText(PU[u.t].e,u.x,u.y+b)}
  for(const e of enemies){if(e.dead)continue;
    if(e.type==='beetle')drawBeetle(e);
    else drawAnt(e.x,e.y,e.a,e.type==='soldier'?1.1:.85,e.type==='soldier'?'#2a211b':'#b3302a',e.legT,{mand:e.type==='soldier'});
    if(e.load)drawLoad(e.x,e.y,e.a,.85,[e.load]);
    if(e.stun>0){ctx.fillStyle='#fff2d6';for(let i=0;i<3;i++){const a=clock*6+i*2.1;ell(e.x+Math.cos(a)*12,e.y-e.r-6+Math.sin(a)*4,2,2);ctx.fill()}}
  }
  if(P){
    const s=P.big>0?1.55:1;
    if(!(P.inv>0&&Math.floor(clock*14)%2)){
      if(P.fire>0){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(P.x,P.y,2,P.x,P.y,P.r*2.6);g.addColorStop(0,'rgba(255,140,40,.55)');g.addColorStop(1,'rgba(255,80,20,0)');ctx.fillStyle=g;ell(P.x,P.y,P.r*2.6,P.r*2.6);ctx.fill();ctx.restore()}
      drawAnt(P.x,P.y,P.a,s,P.fire>0?'#e8561c':'#d98f1d',P.legT,{band:'#fff2d6',leg:'#2a1605'});
      drawLoad(P.x,P.y,P.a,s,P.load);
    }
    if(P.stun>0){ctx.fillStyle='#fff2d6';for(let i=0;i<3;i++){const a=clock*6+i*2.1;ell(P.x+Math.cos(a)*13,P.y-P.r-8+Math.sin(a)*4,2,2);ctx.fill()}}
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.ml);ctx.fillStyle=p.c;ell(p.x,p.y,p.s,p.s);ctx.fill()}ctx.globalAlpha=1;
  if(A&&A.dark&&P){
    const g=ctx.createRadialGradient(P.x,P.y,50,P.x,P.y,250);g.addColorStop(0,'rgba(6,10,22,0)');g.addColorStop(1,'rgba(6,10,22,.9)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalCompositeOperation='lighter';const h=ctx.createRadialGradient(home.x,home.y,4,home.x,home.y,110);h.addColorStop(0,'rgba(255,200,90,.45)');h.addColorStop(1,'rgba(255,200,90,0)');ctx.fillStyle=h;ell(home.x,home.y,110,110);ctx.fill();
    for(const s of seeds)if(s.v>1){ctx.fillStyle='rgba(255,220,90,.35)';ell(s.x,s.y,12,12);ctx.fill()}ctx.restore();
  }
  ctx.font='20px "Lilita One",Nunito,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#1a0f08';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l*1.5);ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y)}ctx.globalAlpha=1;
  if(joy.on){ctx.strokeStyle='rgba(255,242,214,.5)';ctx.lineWidth=3;ell(joy.ox,joy.oy,50,50);ctx.stroke();
    const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);ctx.fillStyle='rgba(255,242,214,.55)';ell(joy.ox+Math.cos(a)*l,joy.oy+Math.sin(a)*l,20,20);ctx.fill()}
  ctx.restore();
}

/* ---------- HUD ---------- */
function hud(){
  if(!cfg)return;
  $('hLevel').textContent='Level '+lvl;$('hArea').textContent=A.name;
  $('hSeeds').textContent=Math.min(delivered,cfg.target)+'/'+cfg.target;
  $('hBar').style.width=Math.min(100,delivered/cfg.target*100)+'%';
  const tl=Math.ceil(timeLeft);$('hTime').textContent=tl+'s';$('hTime').className=tl<=10?'low':'';
  $('hLives').textContent='❤️'.repeat(Math.max(0,P.lives));
  const t=tierOf(total),nx=TIERS[t+1];
  $('hHill').textContent=TIERS[t][1]+(nx?' ('+(nx[0]-total)+' to grow)':'');
  $('hScore').textContent=score;
  let h='';for(const kk of['big','fast','fire'])if(P[kk]>0)h+=`<span class="chip">${PU[kk].e} ${Math.ceil(P[kk])}s</span>`;
  if(P.load.length)h+=`<span class="chip">Carrying ${P.load.reduce((a,b)=>a+b,0)}</span>`;
  $('hPow').innerHTML=h;
}

/* ---------- leaderboard ----------
   Backends, picked automatically:
   1. window.SEEDRUSH_API = "https://your-api"  -> GET {api}/scores , POST {api}/scores  (for self-hosting)
   2. claude.ai artifact database (shared board on the published link)
   3. this device only (localStorage)                                                        */
const LB={mode:'local',db:null,unsub:null,submitted:false};
function pid(){try{let id=localStorage.getItem('seedrush_pid');if(!id){id='p'+Math.random().toString(36).slice(2,12);localStorage.setItem('seedrush_pid',id)}return id}catch(e){return 'anon'}}
function savedName(){try{return localStorage.getItem('seedrush_name')||''}catch(e){return ''}}
function cleanName(n){return (n||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16)||'Anonymous ant'}
LB.ready=(async()=>{
  if(window.SEEDRUSH_API){LB.mode='api';return}
  try{if(window.claude&&claude.use){const db=await claude.use('db');if(db){LB.db=db;LB.mode='db'}}}catch(e){}
})();
function localBoard(){try{return JSON.parse(localStorage.getItem('seedrush_board')||'[]')}catch(e){return[]}}
function localSubmit(en){const b=localBoard().filter(x=>x.id!==en.id||x.score>en.score);if(!b.some(x=>x.id===en.id))b.push(en);b.sort((a,c)=>c.score-a.score);try{localStorage.setItem('seedrush_board',JSON.stringify(b.slice(0,20)))}catch(e){}}
async function lbSubmit(en){
  await LB.ready;
  if(LB.mode==='api'){const r=await fetch(window.SEEDRUSH_API.replace(/\/$/,'')+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(en)});if(!r.ok)throw new Error('api');return 'shared'}
  if(LB.mode==='db'){
    try{const ref=LB.db.doc('scores/'+en.id);const cur=await ref.get();
      if(!cur.exists||(cur.data().score||0)<en.score)await ref.set(en);else await ref.update({name:en.name});return 'shared'}
    catch(e){localSubmit(en);return 'local'}}
  localSubmit(en);return 'local';
}
function lbWatch(cb){
  if(LB.mode==='api'){fetch(window.SEEDRUSH_API.replace(/\/$/,'')+'/scores').then(r=>r.json()).then(d=>cb(d.slice(0,20))).catch(()=>cb(null));return()=>{}}
  if(LB.mode==='db'){return LB.db.collection('scores').orderBy('score','desc').limit(20).onSnapshot(s=>cb(s.docs.map(d=>d.data())),()=>cb(localBoard()))}
  cb(localBoard());return()=>{};
}
function renderBoard(list){
  const ul=$('board');if(!ul)return;ul.textContent='';
  if(!list||!list.length){const li=document.createElement('li');li.className='empty';li.textContent=list?'No scores yet. Be the first ant on the board.':'Leaderboard is unreachable right now.';ul.appendChild(li);return}
  const me=pid();
  list.forEach((x,i)=>{const li=document.createElement('li');if(x.id===me)li.className='me';
    const cells=[['rk',i<3?['🥇','🥈','🥉'][i]:String(i+1)],['nm',x.name||'Anonymous ant'],['lv',x.won?'Cleared all 10':'Level '+(x.level||1)],['sc',String(x.score||0)]];
    for(const[c,t]of cells){const sp=document.createElement('span');sp.className=c;sp.textContent=t;li.appendChild(sp)}ul.appendChild(li)});
}
async function showBoard(back,backLabel){
  await LB.ready;
  const note=LB.mode==='local'?'<p class="sub">Scores on this device only.</p>':'';
  show(`<h2>Leaderboard</h2>${note}<ol class="board" id="board"><li class="empty">Loading…</li></ol><div class="btns"><button data-a="back">${backLabel||'Back'}</button></div>`,{back});
  LB.unsub=lbWatch(renderBoard);
}
function scoreForm(){
  LB.submitted=false;
  if(score<=0)return '';
  return `<div class="lbform"><input id="nm" maxlength="16" placeholder="Your name" autocomplete="nickname" aria-label="Your name for the leaderboard"><button data-a="submit">Post score</button></div><p class="sub" id="lbmsg"></p>`;
}
function afterShow(){const i=$('nm');if(i){i.value=savedName();i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ov.querySelector('[data-a=submit]').click()}})}}
async function postScore(won,then){
  if(LB.submitted){then();return}
  const i=$('nm'),name=cleanName(i&&i.value);try{localStorage.setItem('seedrush_name',name)}catch(e){}
  const btn=ov.querySelector('[data-a=submit]');if(btn){btn.disabled=true;btn.textContent='Posting…'}
  const en={id:pid(),name,score,level:lvl,seeds:total,won:!!won,at:Date.now()};
  try{await lbSubmit(en);LB.submitted=true;then()}
  catch(e){if(btn){btn.disabled=false;btn.textContent='Post score'}const m=$('lbmsg');if(m)m.textContent='Could not post your score. Check your connection and try again.'}
}

/* ---------- screens ---------- */
const ov=$('ov');
function show(html,actions){
  if(LB.unsub){LB.unsub();LB.unsub=null}
  ov.innerHTML=`<div class="card">${html}</div>`;ov.classList.remove('hide');
  ov.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{audioInit();sfx('click');actions[b.dataset.a]()}));
  afterShow();const f=ov.querySelector('input')||ov.querySelector('button');if(f)f.focus();
}
function hide(){if(LB.unsub){LB.unsub();LB.unsub=null}ov.classList.add('hide');ov.innerHTML=''}
function menu(){
  state='menu';musicStop();const s=load();
  show(`<h1>Seed Rush</h1><p class="sub">Feed the colony. Build the hill.</p>
  <ul>
   <li>Move with arrow keys or WASD, or drag anywhere on the screen</li>
   <li>🌰 Carry seeds home to your anthill</li>
   <li>🍄 Big: carry 3 seeds and bowl enemies over</li>
   <li>🍬 Speed: run much faster</li>
   <li>🌶️ Fire: burn any enemy you touch</li>
   <li>💧 Dew: one extra life</li>
   <li>🔊 Press M to mute sound</li>
  </ul>
  <div class="btns"><button data-a="new">Start level 1</button>${s&&s.level>1?`<button class="alt" data-a="cont">Continue level ${s.level}</button>`:''}<button class="alt" data-a="board">🏆 Leaderboard</button></div>`,
  {board(){showBoard(menu,'Menu')},new(){lvl=1;score=0;total=0;intro()},cont(){lvl=s.level;score=s.score||0;total=s.total||0;intro()}});
}
function intro(){
  setupLevel(lvl);state='intro';hud();
  const foes=[];if(cfg.raiders)foes.push(cfg.raiders+' raider'+(cfg.raiders>1?'s':''));if(cfg.soldiers)foes.push(cfg.soldiers+' soldier'+(cfg.soldiers>1?'s':''));if(cfg.beetles)foes.push(cfg.beetles+' beetle'+(cfg.beetles>1?'s':''));
  show(`<h2>Level ${lvl}: ${A.name}</h2><p>Bring <b>${cfg.target} seeds</b> home in <b>${cfg.time} seconds</b>.</p>
  <p class="sub">Enemies: ${foes.join(', ')}</p><p>${A.tip}</p><div class="btns"><button data-a="go">Go</button></div>`,{go(){hide();state='play';musicStart()}});
}
function clearLevel(){
  musicStop();sfx('clear');state='clear';const bonus=Math.ceil(timeLeft)*5;score+=bonus;hud();
  if(lvl===10){save({level:1,total:0,score:0});
    show(`<h2>Colony complete!</h2><p>All 10 areas cleared. Your anthill is now a <b>${TIERS[tierOf(total)][1]}</b>.</p>
    <div class="stats"><div><b>${score}</b>score</div><div><b>${total}</b>seeds</div></div>${scoreForm()}<div class="btns"><button class="alt" data-a="again">Play again</button></div>`,
    {submit(){postScore(true,()=>showBoard(()=>{lvl=1;score=0;total=0;intro()},'Play again'))},again(){lvl=1;score=0;total=0;intro()}});return}
  save({level:lvl+1,total,score});
  show(`<h2>Level ${lvl} cleared</h2><div class="stats"><div><b>${delivered}</b>seeds</div><div><b>${kills}</b>enemies</div><div><b>+${bonus}</b>time bonus</div></div>
  <p>Anthill: <b>${TIERS[tierOf(total)][1]}</b></p><p class="sub">Next up: ${AREAS[lvl].name}</p>
  <div class="btns"><button data-a="next">Next level</button></div>`,{next(){lvl++;intro()}});
}
function fail(why){
  state='fail';musicStop();sfx('fail');hud();
  show(`<h2>${why==='time'?'Out of time':'Your ant got overrun'}</h2><p>${delivered} of ${cfg.target} seeds made it home. Run score: <b>${score}</b></p>${scoreForm()}
  <div class="btns"><button data-a="retry">Try level ${lvl} again</button><button class="alt" data-a="menu">Menu</button></div>`,
  {submit(){postScore(false,()=>showBoard(()=>{score=startScore;total=startTotal;intro()},'Try level '+lvl+' again'))},retry(){score=startScore;total=startTotal;intro()},menu(){score=startScore;total=startTotal;menu()}});
}
function pause(){if(state==='play'){state='pause';musicStop();show(`<h2>Paused</h2><div class="btns"><button data-a="res">Resume</button><button class="alt" data-a="menu">Menu</button></div>`,{res(){hide();state='play';musicStart()},menu(){score=startScore;total=startTotal;menu()}})}}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if((e.code==='Escape'||e.code==='KeyP')&&state==='play'){pause();return}
  keys.add(e.code);
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;if(e.code==='KeyM'){audioInit();setMute(!AU.muted)}});
$('mute').addEventListener('click',()=>{audioInit();setMute(!AU.muted);$('mute').blur()});
addEventListener('pointerdown',()=>audioInit(),{once:true});
addEventListener('blur',()=>{keys.clear();joy.on=false;pause()});
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;const p=cpos(e);Object.assign(joy,{on:true,ox:p.x,oy:p.y,x:p.x,y:p.y,id:e.pointerId});cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){const p=cpos(e);joy.x=p.x;joy.y=p.y}});
const up=e=>{if(e.pointerId===joy.id)joy.on=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- loop ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='play'){update(dt);hud()}else clock+=dt*.5;
  draw();requestAnimationFrame(loop);
}
setMute(AU.muted);fit();lvl=1;setupLevel(1);menu();requestAnimationFrame(loop);
</script>
</body>
